<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <title>LojaGamer</title>
</head>
<body>
    <header>
        <h1 class="logo">Loja<span>Gamer</span></h1>
        <div class="menu-hamburguer" id="menu-icone">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav id="nav-menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section id="banner">
        <h2 id="texto">DON'T DARE WITH THE DEVIL</h2>
        <div class="banner-img">
            <img id="cuphead" src="./src/assets/cuphead.png" alt="cuphead">
            <img id="imgBanner"/>
            <img id="mugmam" src="./src/assets/mugmam.png" alt="mugmam">
        </div>
    </section>

    <main id="container">
        <h2 id="anuncio">Produtos em Destaques</h2>
        <section class="card">
            <div class="card-game">
                <img src="./src/assets/console.png" alt="Produto1">
                <article class="card-content">
                    <h3>CONSOLE</h3>
                    <p class="preco">300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
            <div class="card-game">
                <img src="./src/assets/miniatura para setup.png" alt="Produto2">
                <article class="card-content">
                    <h3>MINIATURA PARA SETUP</h3>
                    <p class="preco">300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
            <div class="card-game">
                <img src="./src/assets/caneca.png" alt="Produto3">
                <article class="card-content">
                    <h3>CANECA</h3>
                    <p class="preco">300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
            <div class="card-game">
                <img src="./src/assets/calice.png" alt="Produto4">
                <article class="card-content">
                    <h3>FUNKO POP CÁLICE</h3>
                    <p class="preco">300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
            <div class="card-game">
                <img src="./src/assets/jogo.png" alt="Produto5">
                <article class="card-content">
                    <h3>JOGO</h3>
                    <p class="preco">300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
            <div class="card-game">
                <img src="./src/assets/quadro.png" alt="Produto6">
                <article class="card-content">
                    <h3>QUADRO</h3>
                    <p class="preco">300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy;-2026 LojaGamer-Direitos Reservados</p>
    </footer>

    <script src="./src/js/script.js"></script>

</body>
</html>
